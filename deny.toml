# cargo-deny configuration for sd-video-recovery

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
ignore = []

[licenses]
version = 2
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
]
confidence-threshold = 0.8

[bans]
version = 2
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
