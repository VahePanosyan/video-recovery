[package]
name = "sd-video-recovery"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Read-only Windows CLI tool for recovering deleted or quick-formatted MP4/MOV videos from FAT32 and exFAT SD cards"
license = "MIT"
readme = "README.md"
repository = "https://github.com/example/sd-video-recovery"
keywords = ["recovery", "video", "mp4", "fat32", "exfat"]
categories = ["command-line-utilities", "filesystem", "multimedia::video"]

[lib]
name = "sd_video_recovery"
path = "src/lib.rs"

[[bin]]
name = "sd-video-recovery"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
crc32fast = "1.5.3"
hadris-fat-raw = { version = "=0.3.0", default-features = false }
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "1.0.69"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }

